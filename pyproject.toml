[project]
name = "otk"
version = "1.0.0"
description = "Automated trading bot for Optiver's Optibook exchange: engine, strategies, risk, replay and simulator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
feed = ["websocket-client>=1.8", "msgpack>=1.0", "lz4>=4.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "websocket-client>=1.8", "msgpack>=1.0", "lz4>=4.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
source = ["src/otk"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
